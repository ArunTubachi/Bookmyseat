<article class="movie-card">{% if movie.poster %}<img src="{{ movie.poster.url }}" alt="{{ movie.title }} poster">{% else %}<div class="poster-placeholder">{{ movie.title|slice:':1' }}</div>{% endif %}<div class="movie-card-body"><p class="eyebrow">{{ movie.genre }} · {{ movie.language }}</p><h3>{{ movie.title }}</h3><p class="muted">{{ movie.duration }} min · ★ {{ movie.rating }}</p><a class="text-link" href="{% url 'movie_detail' movie.pk %}">View details →</a></div></article>
